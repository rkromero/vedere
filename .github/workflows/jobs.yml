name: Jobs programados (respaldo)

# La API ya corre los jobs con setInterval; este cron los dispara además desde afuera por si el servicio
# estuvo caído. Necesita la variable de repositorio API_URL (p. ej. https://api.vedere.com.ar) y el secret
# CRON_SECRET (el mismo valor que en Railway).
on:
  schedule:
    - cron: '15 * * * *' # cada hora: carrito abandonado y volvió el stock
    - cron: '30 9 * * *' # diario: Plan Rivedere
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Carrito abandonado + volvió el stock
        if: ${{ github.event.schedule != '30 9 * * *' }}
        run: |
          for job in carrito-abandonado volvio-stock; do
            curl -fsS -X POST "${{ vars.API_URL }}/jobs/$job" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" || echo "falló $job"
          done
      - name: Plan Rivedere
        if: ${{ github.event.schedule == '30 9 * * *' || github.event_name == 'workflow_dispatch' }}
        run: |
          curl -fsS -X POST "${{ vars.API_URL }}/jobs/rivedere" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
