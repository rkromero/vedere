name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Valores ficticios sólo para compilar/testear. Los reales viven en Railway.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-de-mas-de-32-caracteres-xxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-de-mas-de-32-caracteres-xxx
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate + build db
        run: pnpm --filter @vedere/db build

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e · Playwright (compra y paneles)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NODE_ENV: production
      PORT: '4000'
      HOST: 127.0.0.1
      WEB_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-access-secret-de-mas-de-32-caracteres-xxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-de-mas-de-32-caracteres-xxx
      COOKIE_SECURE: 'false'
      RATE_LIMIT_MAX: '1000'
      RATE_LIMIT_AUTH_MAX: '1000'
      STORAGE_DRIVER: local
      UPLOADS_DIR: ./uploads
      ADMIN_EMAIL: admin@vedere.local
      ADMIN_PASSWORD: ci-admin-password-e2e
      ADMIN_NOMBRE: Admin CI
      OPTICA_PASSWORD: ci-optica-password-e2e
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Base de datos (migraciones + seed)
        run: |
          pnpm --filter @vedere/db build
          pnpm --filter @vedere/db exec prisma migrate deploy
          pnpm --filter @vedere/db exec tsx prisma/seed.ts

      - name: Build API y web
        run: |
          pnpm --filter @vedere/api build
          pnpm --filter @vedere/web build

      - name: Levantar API y web
        run: |
          (cd apps/api && node dist/server.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm exec next start --port 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4000/health > /dev/null 2>&1 && curl -fsS http://localhost:3000/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://localhost:3000/

      - name: Navegadores de Playwright
        run: pnpm --filter @vedere/e2e exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm --filter @vedere/e2e test

      - name: Logs de los servidores (si falló)
        if: failure()
        run: |
          echo "::group::api.log"; tail -n 200 /tmp/api.log || true; echo "::endgroup::"
          echo "::group::web.log"; tail -n 200 /tmp/web.log || true; echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
