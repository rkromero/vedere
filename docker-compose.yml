# Postgres local para desarrollo. Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vedere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vedere
      POSTGRES_PASSWORD: vedere
      POSTGRES_DB: vedere
    ports:
      - '5432:5432'
    volumes:
      - vedere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedere -d vedere']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vedere_pgdata:
